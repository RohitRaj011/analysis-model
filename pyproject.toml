[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "analysis-model"
version = "0.1.0"
description = "Equity analysis models with a Streamlit UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.32.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.8.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "yfinance>=0.2.40",
]

[tool.setuptools.packages.find]
where = ["src"]
